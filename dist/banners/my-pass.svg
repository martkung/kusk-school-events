<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="650" viewBox="0 0 1800 650"><rect width="1800" height="650" fill="#e8efdf"/><circle cx="1700" cy="60" r="360" fill="#d5e4c9"/><circle cx="80" cy="660" r="210" fill="#dce8bb"/><g font-family="Tahoma,sans-serif"><text x="105" y="116" fill="#3f6756" font-size="24" letter-spacing="5">KUSK EVENTS</text><text x="100" y="250" fill="#164d3b" font-size="70" font-weight="bold">สมัครแล้ว? เปิดบัตรได้เลย</text><text x="105" y="335" fill="#315d4e" font-size="38">ดูสถานะและบัตรเข้าร่วมงานได้ที่ “กิจกรรมของฉัน”</text><text x="106" y="418" fill="#526f61" font-size="28">เข้าสู่ระบบด้วยบัญชีเดิมที่ใช้สมัครกิจกรรม</text><rect x="105" y="477" width="350" height="70" rx="12" fill="#075e48"/><text x="147" y="522" fill="#fff" font-size="29" font-weight="bold">ไปกิจกรรมของฉัน →</text><rect x="1230" y="130" width="405" height="390" rx="28" fill="#fff"/><rect x="1230" y="130" width="405" height="100" rx="28" fill="#075e48"/><rect x="1230" y="195" width="405" height="35" fill="#075e48"/><text x="1270" y="195" fill="#fff" font-size="30" font-weight="bold">KUSK EVENTS</text><circle cx="1432" cy="338" r="65" fill="#e8f2e9"/><path d="m1398 337 25 25 46-51" fill="none" stroke="#075e48" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><text x="1280" y="460" fill="#164d3b" font-size="30">บัตรเข้าร่วมกิจกรรม</text><text x="106" y="603" fill="#527363" font-size="22">สาธิตเกษตรฯ กำแพงแสน</text></g></svg>
